<!DOCTYPE html>
<!-- Deployed as gh-pages' root index.html; redirects to the latest release (see release.yml). A real
     redirect page rather than a symlink, since GitHub Pages doesn't resolve git-stored symlinks. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=./release/" />
    <link rel="canonical" href="./release/" />
    <title>HDRView</title>
    <script>
      window.location.replace("./release/");
    </script>
  </head>
  <body>
    <p>Redirecting to the <a href="./release/">latest HDRView release</a>&hellip;</p>
  </body>
</html>
