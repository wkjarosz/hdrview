name: macOS build

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
    paths:
      # This action only runs on push when files affecting the build change
      - "**.cpp"
      - "**.h"
      - "**.metal"
      - "**.cmake"
      - "**Lists.txt"
      - "**-mac.yml"
  workflow_dispatch:

concurrency:
  # A newer commit on the same branch makes an older run pointless, and it goes on holding a runner for
  # the twenty-odd minutes the matrix takes. Grouped by head branch, so a pull_request run and any push
  # run for that branch share a group -- ref_name rather than ref, because a push reports the fully
  # qualified refs/heads/<name>, which never matches the bare name a pull_request puts in head_ref.
  # master is exempt: every commit landing there is worth building. On master the group is per-commit,
  # so nothing there ever queues behind or cancels anything else: GitHub keeps only one *pending* run
  # per group even when cancel-in-progress is false, so a second push would otherwise cancel the first
  # one's queued run before it started.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    name: ${{ matrix.config.name }} (${{ matrix.buildtype }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # macos-14 is an arm64 runner
          - {
              name: "macOS 14 universal",
              os: macos-14,
              preset: "macos-universal",
            }
          - {
              name: "macOS 15 universal",
              os: macos-15,
              preset: "macos-universal",
            }
          - {
              name: "macOS 14 Apple Silicon CPM",
              os: macos-14,
              preset: "macos-arm64-cpm",
            }
          - {
              name: "macOS 14 Apple Silicon Local",
              os: macos-14,
              preset: "macos-arm64-local",
            }
          - {
              name: "macOS 15 Apple Silicon CPM",
              os: macos-15,
              preset: "macos-arm64-cpm",
              # Only this one preset/os combo builds and runs hdrview_tests (Release only, see the Configure CMake
              # and Run unit tests steps below) - CPM always fetches OpenEXR/PNG from source for -cpm/-universal
              # presets, which is what the vendored-test-image-backed tests in tests/test_exr_io.cpp and
              # tests/test_png_io.cpp conditionally compile against. Running the same suite across every preset in
              # this ~36-combination matrix would be redundant.
              run_tests: true,
            }
          - {
              name: "macOS 15 Apple Silicon Local",
              os: macos-15,
              preset: "macos-arm64-local",
            }
          - {
              name: "macOS 15 Intel CPM",
              os: macos-15-intel,
              preset: "macos-x86_64-cpm",
            }
          - {
              name: "macOS 15 Intel Local",
              os: macos-15-intel,
              preset: "macos-x86_64-local",
            }

        buildtype: [Release, Debug]

    steps:
      - name: Install dependencies
        run: brew install --quiet ninja create-dmg dylibbundler libjpeg-turbo little-cms2 zlib aom libde265 x265 openjpeg openh264

      # The packages below are each also built from source by CPM for -cpm/-universal presets (which don't set
      # CPM_USE_LOCAL_PACKAGES, so CPM always fetches regardless of what's installed system-wide). Installing them
      # via Homebrew unconditionally is not just redundant for those presets but actively breaks the build: on
      # Intel runners, /usr/local/include is one of AppleClang's implicit default header search locations (unlike
      # /opt/homebrew on Apple Silicon), so the Homebrew copy's headers can silently shadow CPM's own fetched
      # copies mid-build, causing incomplete-type/ABI-mismatch failures (seen with jpeg-xl and spdlog/fmt) that
      # depend on what happens to be installed. -local presets, on the other hand, explicitly want these to come
      # from Homebrew (that's the whole point of CPM_USE_LOCAL_PACKAGES=ON there), so only install them there.
      - name: Install dependencies also built by CPM (local presets only)
        if: contains(matrix.config.preset, 'local')
        run: brew install --quiet jpeg-xl libultrahdr libheif libpng imath openexr cli11 spdlog fmt libexif libraw

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Buildtype is part of the key (ccache below already varies by buildtype) so Debug and Release don't race
      # to overwrite one shared cache entry; restore-keys stays preset-only so either buildtype can seed the other.
      #
      # path and hashFiles avoid a workspace-root "**", which would walk into build/'s CPack staging symlink and
      # every installed Xcode SDK - prohibitively expensive to glob. cpm_modules is always at the workspace root
      # (CPM_SOURCE_CACHE above), so path needs no "**" either.
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-${{ matrix.buildtype }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-

      # Setup caching of build artifacts to reduce total build time (only Linux and MacOS)
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ matrix.buildtype }}

      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.config.run_tests }}" = "true" ] && [ "${{ matrix.buildtype }}" = "Release" ]; then
            EXTRA_FLAGS="-DHDRVIEW_BUILD_TESTS=ON"
          fi
          cmake --preset ${{ matrix.config.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $EXTRA_FLAGS

      - name: Build
        run: |
          BUILDTYPE_LOWER=$(echo "${{ matrix.buildtype }}" | tr '[:upper:]' '[:lower:]')
          cmake --build --preset ${{ matrix.config.preset }}-${BUILDTYPE_LOWER}

      - name: Checking that HDRView runs
        run: |
          ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ matrix.buildtype }}/HDRView.app/Contents/MacOS/HDRView --help

      - name: Run unit tests
        if: matrix.config.run_tests == true && matrix.buildtype == 'Release'
        working-directory: ${{ github.workspace }}/build/${{ matrix.config.preset }}
        run: ctest -C ${{ matrix.buildtype }} --output-on-failure

      - name: Package with CPack
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: |
          for i in 1 2 3; do
            if cpack -C ${{ matrix.buildtype }} -G DragNDrop; then
              break
            elif [ $i -eq 3 ]; then
              echo "cpack failed after 3 attempts"
              exit 1
            else
              echo "cpack failed, retrying ($i)..."
              # Clean up any leftover mounts
              for vol in /Volumes/HDRView*; do
                [ -d "$vol" ] && hdiutil detach "$vol" 2>/dev/null || true
              done
              sleep 2
            fi
          done

      - name: Archive dmg (macOS)
        uses: actions/upload-artifact@v6
        with:
          name: HDRView-${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ matrix.buildtype }}.dmg
          path: ${{ github.workspace }}/build/${{ matrix.config.preset }}/HDRView-*.dmg

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ matrix.buildtype }}
          path: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ matrix.buildtype }}
