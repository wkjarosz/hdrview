name: Linux build

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
    paths:
      # This action only runs on push when files affecting the build change
      - "**.cpp"
      - "**.h"
      - "**.glsl"
      - "**.cmake"
      - "**Lists.txt"
      - "**-linux.yml"
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch: head_ref for pull requests, ref_name for pushes, since a push
  # reports refs/heads/<name> where a pull_request puts the bare name in head_ref. master is grouped per
  # commit instead, so every commit landing there builds.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    name: ${{ matrix.config.name }} (${{ matrix.buildtype }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # The one combo that builds and runs hdrview_tests (Release only). -cpm/-universal presets always
          # fetch OpenEXR/PNG from source, which is what the vendored-test-image tests in
          # tests/test_exr_io.cpp and tests/test_png_io.cpp compile against.
          - { name: "Ubuntu 24.04 CPM", os: ubuntu-24.04, preset: "linux-cpm", arch: "x86_64", run_tests: true}

          # The same two suites under AddressSanitizer and UndefinedBehaviorSanitizer, which a plain build
          # cannot see: a use-after-free or a non-finite-to-integer cast passes the tests silently. Release
          # keeps the instrumented build tolerably fast.
          - { name: "Ubuntu 24.04 CPM sanitizers", os: ubuntu-24.04, preset: "linux-cpm", arch: "x86_64", run_tests: true, sanitizer: "asan" }

          # ThreadSanitizer, which the entry above cannot stand in for: a data race that corrupts nothing on
          # a given run is invisible to ASan/UBSan, and HDRView loads images off-thread, computes stats
          # through a thread pool, and uploads textures in tiles across frames.
          #
          # On linux-local, for two reasons: GCC's TSan runtime segfaults on the linux-cpm build before
          # reaching main, recursing inside its own __cxa_atexit interceptor, and uninstrumented system
          # libraries keep reports in HDRView's own code instead of in a suppressions file. The cost is that
          # races at the boundary with an uninstrumented library are invisible, and that the system libpng is
          # too old for cICP (those tests compile out; see tests/test_png_io.cpp).
          - { name: "Ubuntu 24.04 Local TSan", os: ubuntu-24.04, preset: "linux-local", arch: "x86_64", run_tests: true, sanitizer: "tsan" }
          - { name: "Ubuntu 24.04 Local", os: ubuntu-24.04, preset: "linux-local", arch: "x86_64"}

          - { name: "Ubuntu 24.04 CPM arm", os: ubuntu-24.04-arm, preset: "linux-cpm", arch: "arm" }
          - { name: "Ubuntu 24.04 Local arm", os: ubuntu-24.04-arm, preset: "linux-local", arch: "arm" }

          - { name: "Ubuntu 24.04 AppImage", os: ubuntu-24.04, preset: "linux-appimage", arch: "x86_64" }
          - { name: "Ubuntu 24.04 AppImage arm", os: ubuntu-24.04-arm, preset: "linux-appimage", arch: "arm" }

          - { name: "Ubuntu 22.04 CPM", os: ubuntu-22.04, preset: "linux-cpm", arch: "x86_64" }
          - { name: "Ubuntu 22.04 CPM arm", os: ubuntu-22.04-arm, preset: "linux-cpm", arch: "arm" }
          # ubuntu 22.04 had openexr 2, but we require 3
          # - { name: "Ubuntu 22.04 Local", os: ubuntu-22.04, preset: "linux-local" }
        buildtype: [Release, Debug]
        exclude:
          # only the Release build of the sanitizer entry is instrumented; its Debug build would repeat the
          # plain CPM Debug job
          - config: { name: "Ubuntu 24.04 CPM sanitizers", os: ubuntu-24.04, preset: "linux-cpm", arch: "x86_64", run_tests: true, sanitizer: "asan" }
            buildtype: Debug
          - config: { name: "Ubuntu 24.04 Local TSan", os: ubuntu-24.04, preset: "linux-local", arch: "x86_64", run_tests: true, sanitizer: "tsan" }
            buildtype: Debug

    steps:
      # Ubuntu 24.04 splits libheif's codecs into plugin packages that libheif-dev only suggests. Without the
      # encoder plugins libheif offers its built-in JPEG encoder first, which stores no alpha.
      - name: Install dependencies (Ubuntu 24.04)
        if: startsWith(matrix.config.os, 'ubuntu-24.04')
        run: sudo apt-get update && sudo apt-get install -y cmake xorg-dev libglu1-mesa-dev zlib1g-dev libxrandr-dev ninja-build libglfw3-dev libfreetype-dev libjpeg-dev libimath-dev libopenexr-dev libpng-dev libtiff-dev liblcms2-dev libwebp-dev libraw-dev libheif-dev libheif-plugin-x265 libheif-plugin-libde265 libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-dav1d libaom-dev libdav1d-dev libde265-dev libx265-dev libjxl-dev libcli11-dev libspdlog-dev libfmt-dev libexif-dev libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev libopenh264-dev libopenjp2-7-dev xvfb

      - name: Install dependencies (Ubuntu 22.04)
        if: startsWith(matrix.config.os, 'ubuntu-22.04')
        run: sudo apt-get update && sudo apt-get install -y cmake xorg-dev libglu1-mesa-dev zlib1g-dev libxrandr-dev ninja-build libglfw3-dev libfreetype-dev libjpeg-dev libpng-dev libtiff-dev liblcms2-dev libwebp-dev libraw-dev libheif-dev libaom-dev libdav1d-dev libde265-dev libx265-dev libcli11-dev libspdlog-dev libfmt-dev libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev libopenh264-dev libopenjp2-7-dev

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install Pillow

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version variables
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NO_V=$VERSION_NO_V" >> $GITHUB_ENV

      # Buildtype is part of the key (ccache below already varies by buildtype) so Debug and Release don't race
      # to overwrite one shared cache entry; restore-keys stays preset-only so either buildtype can seed the other.
      #
      # path and hashFiles avoid a workspace-root "**", scoped the same way as ci-mac.yml. cpm_modules is
      # always at the workspace root (CPM_SOURCE_CACHE above).
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-${{ matrix.config.sanitizer || 'plain' }}-${{ matrix.buildtype }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-

      # Setup caching of build artifacts to reduce total build time (only Linux and MacOS)
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ matrix.config.sanitizer || 'plain' }}-${{ matrix.buildtype }}

      # Only the image corpora, not the libraries: linux-local links the system OpenEXR and libpng, but the
      # tests that sweep real-world files still need the data those projects vendor. Sparse and shallow, so
      # this pulls a few MB. Pinned to the revisions CPM uses for the -cpm presets, so both test the same data.
      - name: Fetch OpenEXR test images
        if: matrix.config.sanitizer == 'tsan'
        uses: actions/checkout@v5
        with:
          repository: AcademySoftwareFoundation/openexr
          ref: v3.4.13
          path: test-corpora/openexr
          sparse-checkout: src/test/bin/test_images
          fetch-depth: 1

      - name: Fetch libpng test images
        if: matrix.config.sanitizer == 'tsan'
        uses: actions/checkout@v5
        with:
          repository: pnggroup/libpng
          ref: 62954d33fe729566e9d17b78ddaf013896a1f3c5
          path: test-corpora/libpng
          sparse-checkout: contrib
          fetch-depth: 1

      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.config.run_tests }}" = "true" ] && [ "${{ matrix.buildtype }}" = "Release" ]; then
            EXTRA_FLAGS="-DHDRVIEW_BUILD_TESTS=ON -DHDRVIEW_BUILD_GUI_TESTS=ON"
            case "${{ matrix.config.sanitizer }}" in
              asan)
                EXTRA_FLAGS="$EXTRA_FLAGS -DUSE_SANITIZER=Address;Undefined"
                ;;
              tsan)
                # No GUI tests: they drive a real GL context whose uninstrumented driver threads are where
                # TSan noise would come from. -g because a race report without a usable stack cannot be
                # triaged. linux-local gets its libraries from the system, so the vendored image corpora are
                # supplied explicitly from the checkout above.
                EXTRA_FLAGS="$EXTRA_FLAGS -DHDRVIEW_BUILD_GUI_TESTS=OFF -DUSE_SANITIZER=Thread -DCMAKE_CXX_FLAGS=-g"
                EXTRA_FLAGS="$EXTRA_FLAGS -DHDRVIEW_TEST_OPENEXR_DIR=${{github.workspace}}/test-corpora/openexr/src/test/bin/test_images"
                EXTRA_FLAGS="$EXTRA_FLAGS -DHDRVIEW_TEST_PNG_CONTRIB_DIR=${{github.workspace}}/test-corpora/libpng/contrib"
                ;;
            esac
          fi
          cmake --preset ${{ matrix.config.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $EXTRA_FLAGS

      - name: Build
        run: |
          BUILDTYPE_LOWER=$(echo "${{ matrix.buildtype }}" | tr '[:upper:]' '[:lower:]')
          cmake --build --preset ${{ matrix.config.preset }}-${BUILDTYPE_LOWER}

      - name: Checking that HDRView runs
        run: |
          ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ matrix.buildtype }}/HDRView --help

      # Both sanitizers have to abort, or the job goes green with the report buried in the log. Third-party
      # undefined behavior we can't fix is filtered by the suppressions file instead.
      # detect_leaks=0: the app leaks by design at exit (static GPU and font state outliving main).
      - name: Sanitizer environment
        if: matrix.config.sanitizer
        run: |
          if [ "${{ matrix.config.sanitizer }}" = "tsan" ]; then
            # halt_on_error for the same reason as above; second_deadlock_stack makes lock-order-inversion
            # reports show both acquisition sites
            echo "TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1" >> $GITHUB_ENV
          else
            echo "ASAN_OPTIONS=detect_leaks=0:abort_on_error=1" >> $GITHUB_ENV
            echo "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:suppressions=${{github.workspace}}/.github/ubsan-suppressions.txt" >> $GITHUB_ENV
          fi

      - name: Run unit tests
        if: matrix.config.run_tests == true && matrix.buildtype == 'Release'
        working-directory: ${{ github.workspace }}/build/${{ matrix.config.preset }}
        # excludes hdrview_gui_tests, which needs the display server "Run GUI tests" below sets up
        run: ctest -C ${{ matrix.buildtype }} --output-on-failure -E hdrview_gui_tests

      # hdrview_gui_tests drives a real GLFW/OpenGL HDRView window via Dear ImGui Test Engine, so it needs a
      # display server, which GitHub's Ubuntu runners lack by default. Its own step, since it is a separate
      # ctest-registered binary whose failure output should not mix into the doctest suite's. Linux-only:
      # macOS/Windows headless GUI automation is an unsolved gap (Hello ImGui's own CI doesn't cover it).
      - name: Run GUI tests
        if: matrix.config.run_tests == true && matrix.buildtype == 'Release' && matrix.config.sanitizer != 'tsan'
        working-directory: ${{ github.workspace }}/build/${{ matrix.config.preset }}
        run: xvfb-run -a ctest -C ${{ matrix.buildtype }} --output-on-failure -R hdrview_gui_tests

      - name: Package
        if: matrix.config.preset == 'linux-appimage'
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: cpack -C ${{ matrix.buildtype }} -G External

      # Unpacks the AppImage and starts it, the only way to exercise the installed asset layout: the
      # "Checking that HDRView runs" step above runs the build-tree binary, which finds its assets through
      # HDRVIEW_BUILD_TREE_ASSETS_DIR and never loads a shader. xvfb-run as with the GUI tests above.
      - name: Checking that the AppImage runs
        if: matrix.config.preset == 'linux-appimage'
        run: xvfb-run -a ${{github.workspace}}/.github/scripts/check-appimage.sh ${{github.workspace}}/build/${{ matrix.config.preset }}/*.appimage
        
      - name: Archive package
        if: matrix.config.preset == 'linux-appimage'
        uses: actions/upload-artifact@v6
        with:
          name: appimage-${{ matrix.config.os }}-${{ matrix.buildtype }}
          path: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/*.appimage

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ matrix.buildtype }}
          path: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ matrix.buildtype }}
