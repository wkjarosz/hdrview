name: Windows build

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
    paths:
      # This action only runs on push when files affecting the build change
      - "**.cpp"
      - "**.h"
      - "**.glsl"
      - "**.cmake"
      - "**Lists.txt"
      - "**-windows.yml"
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch: head_ref for pull requests, ref_name for pushes, since a push
  # reports refs/heads/<name> where a pull_request puts the bare name in head_ref. master is grouped per
  # commit instead, so every commit landing there builds.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: ${{ matrix.config.name }} (${{ matrix.buildtype }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        buildtype: [Release, Debug]
        config:
          # The one preset that builds and runs hdrview_tests (Release only). windows-msvc/windows-ninja have
          # no CPM_USE_LOCAL_PACKAGES option, so they always fetch OpenEXR/PNG from source, which is what the
          # vendored-test-image tests in tests/test_exr_io.cpp and tests/test_png_io.cpp compile against.
          - { name: "Windows MSVC", os: windows-latest, preset: "windows-msvc", run_tests: true }
          - { name: "Windows Ninja", os: windows-latest, preset: "windows-ninja" }
          # Native ARM64 build on GitHub's hosted windows-11-arm runner (see issue #166). HEIC/AVCI are off to
          # match the x64 release build until libheif's AOM/dav1d dependencies build cleanly for Windows ARM64.
          - {
              name: "Windows ARM64 MSVC",
              os: windows-11-arm,
              preset: "windows-arm64-msvc",
              msvc_arch: "arm64",
              flags: "-DHDRVIEW_ENABLE_HEIC=OFF -DHDRVIEW_ENABLE_AVCI=OFF",
            }

    steps:
      - name: Install dependencies
        run: pip install Pillow

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.msvc_arch || 'x64' }}

      - name: Configure CMake
        run: |
          $extraFlags = @()
          if ("${{ matrix.config.run_tests }}" -eq "true" -and "${{ matrix.buildtype }}" -eq "Release") {
            $extraFlags += "-DHDRVIEW_BUILD_TESTS=ON"
          }
          if ("${{ matrix.config.flags }}") {
            $extraFlags += "${{ matrix.config.flags }}" -split " "
          }
          cmake --preset ${{ matrix.config.preset }} @extraFlags

      - name: Build
        run: |
          $buildtype_lower = "${{ matrix.buildtype }}".ToLower()
          cmake --build --preset ${{ matrix.config.preset }}-$buildtype_lower

      - name: Checking that HDRView runs
        working-directory: ${{github.workspace}}
        run: ./build/${{ matrix.config.preset }}/${{ matrix.buildtype }}/HDRView.exe --help

      - name: Verify long-path-aware manifest is embedded
        working-directory: ${{github.workspace}}
        run: |
          $exe = "build/${{ matrix.config.preset }}/${{ matrix.buildtype }}/HDRView.exe"
          mt.exe -nologo -inputresource:"$exe;#1" -out:extracted.manifest
          $manifest = Get-Content extracted.manifest -Raw
          if ($manifest -notmatch "longPathAware") {
            Write-Error "HDRView.exe's embedded manifest does not declare longPathAware=true"
            exit 1
          }
          Write-Host "OK: embedded manifest declares longPathAware"

      - name: Run unit tests
        if: matrix.config.run_tests == true && matrix.buildtype == 'Release'
        working-directory: ${{ github.workspace }}/build/${{ matrix.config.preset }}
        run: ctest -C ${{ matrix.buildtype }} --output-on-failure

      - name: Copy files for archiving
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: |
          cmake -E copy_directory assets deploy/assets/
          cmake -E copy ${{ matrix.buildtype }}/HDRView.exe deploy/

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.config.preset }}-${{ matrix.buildtype }}
          path: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/deploy