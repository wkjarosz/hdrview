name: Publish to releases and github.io website

on:
  push:
    tags:
      - "v*.*"
      - "v*.*.*"
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build_macos:
    name: Build on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # macos-14 is an arm64 runner
          - {
              name: "macOS Apple Silicon",
              os: macos-14,
              preset: "macos-arm64-cpm",
              flags: "-DHDRVIEW_ENABLE_HEIC=OFF -DHDRVIEW_ENABLE_AVCI=OFF",
            }
          - {
              name: "macOS Intel",
              os: macos-15-intel,
              preset: "macos-x86_64-cpm",
              flags: "-DHDRVIEW_ENABLE_HEIC=OFF -DHDRVIEW_ENABLE_AVCI=OFF",
            }

    steps:
      # jpeg-xl/libultrahdr/libheif/libpng/imath/cli11/spdlog/fmt are deliberately not installed here: both
      # configs in this matrix use -cpm presets, which build them from source via CPM regardless. Installing the
      # Homebrew packages leaks /usr/local/include into the CPM build's implicit compiler search path on the
      # Intel runner (where /usr/local/include is a default system include dir, unlike /opt/homebrew on Apple
      # Silicon), shadowing CPM's own internal headers for those packages and breaking the build.
      - name: Install dependencies
        run: brew install ninja create-dmg dylibbundler little-cms2 aom libde265 x265

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version variables
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NO_V=$VERSION_NO_V" >> $GITHUB_ENV

      # path and hashFiles avoid a workspace-root "**", which would walk into build/'s CPack staging symlink and
      # every installed Xcode SDK - prohibitively expensive to glob. cpm_modules is always at the workspace root
      # (CPM_SOURCE_CACHE above), so path needs no "**" either.
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-

      # Setup caching of build artifacts to reduce total build time (only Linux and MacOS)
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.preset }}

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.config.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.config.flags }}

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}-release

      - name: Checking that HDRView runs
        run: |
          "${{github.workspace}}/build/${{ matrix.config.preset }}/${{env.BUILD_TYPE}}/HDRView.app/Contents/MacOS/HDRView" --help

      - name: Package with CPack
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: |
          for i in 1 2 3; do
            if cpack -C ${{env.BUILD_TYPE}} -G DragNDrop; then
              break
            elif [ $i -eq 3 ]; then
              echo "cpack failed after 3 attempts"
              exit 1
            else
              echo "cpack failed, retrying ($i)..."
              # Clean up any leftover mounts
              for vol in /Volumes/HDRView*; do
                [ -d "$vol" ] && hdiutil detach "$vol" 2>/dev/null || true
              done
              sleep 2
            fi
          done

      # - name: Archive build artifacts
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: build-artifacts-${{ matrix.config.os }}-${{ matrix.config.preset }}
      #     path: |
      #       ${{github.workspace}}/build/${{ matrix.config.preset }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: "${{github.workspace}}/build/${{ matrix.config.preset }}/HDRView-*.dmg"
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_linux:
    name: Build on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Ubuntu 24.04 x86_64", os: ubuntu-24.04, preset: "linux-appimage", arch: "x86_64" }
          - { name: "Ubuntu 24.04 arm64", os: ubuntu-24.04-arm, preset: "linux-appimage", arch: "arm64" }

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake xorg-dev libglu1-mesa-dev zlib1g-dev libxrandr-dev ninja-build libglfw3-dev libfreetype-dev libjpeg-dev libimath-dev libopenexr-dev libpng-dev libtiff-dev liblcms2-dev libwebp-dev libraw-dev libheif-dev libaom-dev libde265-dev libx265-dev libjxl-dev libcli11-dev libspdlog-dev libfmt-dev libexif-dev libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev xvfb

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install Pillow

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version variables
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NO_V=$VERSION_NO_V" >> $GITHUB_ENV

      # path and hashFiles avoid a workspace-root "**", which would walk into build/'s CPack staging symlink and
      # every installed Xcode SDK - prohibitively expensive to glob. cpm_modules is always at the workspace root
      # (CPM_SOURCE_CACHE above), so path needs no "**" either.
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-${{ matrix.config.preset }}-

      # Setup caching of build artifacts to reduce total build time (only Linux and MacOS)
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.preset }}

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.config.preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DHDRVIEW_ENABLE_HEIC=OFF -DHDRVIEW_ENABLE_AVCI=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.config.preset }}-release

      - name: Checking that HDRView runs
        run: |
          ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ env.BUILD_TYPE }}/HDRView --help

      - name: Package
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: cpack -C ${{ env.BUILD_TYPE }} -G External

      # Verifies the artifact about to be published actually starts, unlike the build-tree --help check above
      # (see .github/scripts/check-appimage.sh).
      - name: Checking that the AppImage runs
        run: xvfb-run -a ${{github.workspace}}/.github/scripts/check-appimage.sh ${{github.workspace}}/build/${{ matrix.config.preset }}/*.appimage

      # - name: Archive build artifacts
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: build-artifacts-${{ matrix.config.os }}-${{ matrix.config.preset }}-${{ env.BUILD_TYPE }}
      #     path: |
      #       ${{github.workspace}}/build/${{ matrix.config.preset }}/${{ env.BUILD_TYPE }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: "${{github.workspace}}/build/${{ matrix.config.preset }}/*.appimage"
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Build on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        buildtype: [Release]
        config:
          - { name: "Windows MSVC", os: windows-latest, preset: "windows-msvc", arch: "x86_64" }
          - { name: "Windows ARM64 MSVC", os: windows-11-arm, preset: "windows-arm64-msvc", arch: "arm64", msvc_arch: "arm64" }

    steps:
      - name: Install dependencies
        run: pip install Pillow

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.msvc_arch || 'x64' }}

      - name: Set version variables
        run: |
          $VERSION = "${{ github.ref_name }}"
          if ($VERSION.StartsWith('v')) {
            $VERSION_NO_V = $VERSION.Substring(1)
          } else {
            $VERSION_NO_V = $VERSION
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$VERSION"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION_NO_V=$VERSION_NO_V"

      - name: Configure CMake
        run: cmake --preset ${{ matrix.config.preset }} -DHDRVIEW_ENABLE_HEIC=OFF -DHDRVIEW_ENABLE_AVCI=OFF

      - name: Build
        run: |
          $buildtype_lower = "${{ matrix.buildtype }}".ToLower()
          cmake --build --preset ${{ matrix.config.preset }}-$buildtype_lower --verbose

      - name: Checking that HDRView runs
        working-directory: ${{github.workspace}}
        run: ./build/${{ matrix.config.preset }}/${{ matrix.buildtype }}/HDRView.exe --help

      - name: Copy files for archiving and release
        working-directory: ${{github.workspace}}/build/${{ matrix.config.preset }}
        run: |
          cmake -E copy_directory assets deploy/assets/
          cmake -E copy ${{ matrix.buildtype }}/HDRView.exe deploy/

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.config.preset }}-${{ matrix.buildtype }}
          path: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/deploy

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: "zip"
          filename: "HDRView-${{ env.VERSION_NO_V }}-windows-${{ matrix.config.arch }}.zip"
          directory: ${{github.workspace}}/build/${{ matrix.config.preset }}/deploy

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{github.workspace}}/build/${{ matrix.config.preset }}/deploy/HDRView-${{ env.VERSION_NO_V }}-windows-${{ matrix.config.arch }}.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_emscripten:
    name: Build and deploy emscripten webapp
    runs-on: ubuntu-24.04
    # Prerelease tags share ci-emscripten.yml's /dev group (same destination_dir); final releases get
    # their own, since /release is never touched by anything else.
    concurrency:
      group: gh-pages-deploy-${{ contains(github.ref_name, '-') && 'dev' || 'release' }}

    steps:
      # Everything the wasm build links is fetched by CPM and compiled by emcc, so only the host-side build
      # tools are needed here - none of the -dev packages the Linux jobs install.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Placed after the checkout, whose default clean would otherwise wipe actions-cache-folder back out
      # of the workspace.
      #
      # Pinned rather than tracking latest, and kept in step with ci-emscripten.yml: this job publishes
      # straight to gh-pages, so a toolchain regression ships a broken web app with nothing in the diff to
      # explain it. Emscripten 4.0.13 does not build HDRView; don't pin back to it.
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      # cpm_modules is always at the workspace root (CPM_SOURCE_CACHE above), so neither path nor hashFiles
      # needs a "**" that would walk into build/.
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-

      # Caching of build artifacts to reduce total build time. This action only installs ccache and restores
      # its cache; the compiler-launcher flags on the configure step are what route emcc through it.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure CMake
        run: |
          emcmake cmake --preset emscripten -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build ${{github.workspace}}/build/emscripten --parallel

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-emscripten
          path: |
            ${{github.workspace}}/build/emscripten

      - name: CPack
        working-directory: ${{github.workspace}}/build/emscripten
        run: |
          cmake --install .
          mv deploy/HDRView.html deploy/index.html

      # Final releases and prereleases (tags with a SemVer -suffix) each get their own destination_dir,
      # so peaceiris/actions-gh-pages' default "wipe the deploy scope first" behavior can't delete the
      # other's files.

      - name: Publish final release to /release
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: release
          publish_dir: ${{github.workspace}}/build/emscripten/deploy

      - name: Publish prerelease to /dev
        if: ${{ contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: dev
          publish_dir: ${{github.workspace}}/build/emscripten/deploy

      # Root is just a static redirect to /release/, redeployed each final release. keep_files: true
      # since its destination_dir is the branch root, unlike the steps above.
      - name: Stage root redirect
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p "${{github.workspace}}/build/emscripten/root_redirect"
          cp resources/gh-pages-redirect.html "${{github.workspace}}/build/emscripten/root_redirect/index.html"

      - name: Publish root redirect
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{github.workspace}}/build/emscripten/root_redirect
          keep_files: true
