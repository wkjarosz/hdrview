name: Emscripten development build

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"
    paths:
      # This action only runs on push when files affecting the build change
      - "**.cpp"
      - "**.h"
      - "**.glsl"
      - "**.cmake"
      - "**Lists.txt"
      - "**-emscripten.yml"
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch: head_ref for pull requests, ref_name for pushes, since a push
  # reports refs/heads/<name> where a pull_request puts the bare name in head_ref. master is grouped per
  # commit instead, so every commit landing there builds.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.ref == 'refs/heads/master' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build_emscripten:
    name: Build and deploy emscripten webapp
    runs-on: ubuntu-24.04
    # shared with release.yml's prerelease deploy (same destination_dir: dev), so the two cannot race to
    # push gh-pages
    concurrency:
      group: gh-pages-deploy-dev

    steps:
      # everything the wasm build links is fetched by CPM and compiled by emcc, so only host-side build tools
      # are needed here, none of the -dev packages ci-linux.yml installs
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Placed after the checkout, whose default clean would otherwise wipe actions-cache-folder back out of
      # the workspace. Pinned, not tracking latest: this job publishes straight to gh-pages, so a toolchain
      # regression ships a broken web app. Emscripten 4.0.13 does not build HDRView; don't pin back to it.
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.8
          actions-cache-folder: emsdk-cache

      # cpm_modules is always at the workspace root (CPM_SOURCE_CACHE above), so neither path nor hashFiles
      # needs a "**" that would walk into build/
      - uses: actions/cache@v5
        with:
          path: "cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ github.workflow }}-cpm-modules-

      # Caching of build artifacts to reduce total build time. This action only installs ccache and restores
      # its cache; the compiler-launcher flags on the configure step route emcc through it.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure CMake
        run: |
          emcmake cmake --preset emscripten -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build ${{github.workspace}}/build/emscripten --parallel

      - name: Archive build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-emscripten
          path: |
            ${{github.workspace}}/build/emscripten

      - name: CPack
        working-directory: ${{github.workspace}}/build/emscripten
        run: |
          cmake --install .
          mv deploy/HDRView.html deploy/index.html

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: dev
          publish_dir: ${{github.workspace}}/build/emscripten/deploy
